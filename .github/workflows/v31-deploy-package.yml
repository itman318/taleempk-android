name: Package TaleemPK v3.1 Website Backend

on:
  push:
    branches: [flutter-premium-v2]
    paths:
      - '.github/workflows/v31-deploy-package.yml'
      - 'backend/**'
      - 'tools/v31_finalize.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Finalize v3.1 deploy source
        run: python3 tools/v31_finalize.py
      - name: Validate PHP
        run: |
          php -l backend/api/mobile.php
          php -l backend/api/mobile_social_v31.php
      - name: Create website backend package
        run: |
          mkdir -p TaleemPK-v3.1-website/api
          cp backend/api/mobile.php TaleemPK-v3.1-website/api/mobile.php
          cp backend/api/mobile_social_v31.php TaleemPK-v3.1-website/api/mobile_social_v31.php
          cp flutter/V3.1.md TaleemPK-v3.1-website/README-v3.1.md
          zip -r TaleemPK-v3.1-website-backend.zip TaleemPK-v3.1-website
      - uses: actions/upload-artifact@v4
        with:
          name: TaleemPK-v3.1-website-backend
          path: TaleemPK-v3.1-website-backend.zip
          if-no-files-found: error
