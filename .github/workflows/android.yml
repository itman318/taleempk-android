name: Build TaleemPK Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate companion PHP API
        run: php -l backend/api/mobile.php

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Lint and build installable APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TaleemPK-v1.6.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaleemPK-Android-APK
          path: TaleemPK-v1.6.0.apk
          if-no-files-found: error
          retention-days: 30
