name: Build StudyHub Flutter APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'tools/patch_chat_v26.py'
      - '.github/workflows/flutter-premium.yml'
  push:
    branches: [main, flutter-premium-v2]
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'tools/patch_chat_v26.py'
      - '.github/workflows/flutter-premium.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.6 deep chat audit
        working-directory: .
        run: python tools/patch_chat_v26.py
      - name: Commit v2.6 chat fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/flutter-premium-v2'
        working-directory: .
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fix voice playback block layout and emoji history"
            git push
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: StudyHub-Flutter-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
