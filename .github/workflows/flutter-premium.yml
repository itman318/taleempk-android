name: Build TaleemPK Flutter APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'realtime/**'
      - 'render.yaml'
      - 'tools/**'
      - '.github/workflows/flutter-premium.yml'
  push:
    branches: [main, flutter-premium-v2]
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'realtime/**'
      - 'render.yaml'
      - 'tools/**'
      - '.github/workflows/flutter-premium.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Generate final TaleemPK v4.7 source
        working-directory: .
        run: |
          python3 tools/v31_finalize.py
          python3 tools/run_v32.py
          python3 tools/v33_final.py
          python3 tools/v34_chat_runtime.py
          python3 tools/v35b_profile_media_polish.py
          python3 tools/v35c_cleanup.py
          python3 tools/v36_ui_navigation_polish.py
          python3 tools/v36b_splash_fix.py
          python3 tools/v37b_chat_identity_polish.py
          python3 tools/v37c_analyzer_cleanup.py
          python3 tools/v38b_boundary_fix.py
          python3 tools/v39b_runner.py
          python3 tools/v40_runner.py
          python3 tools/v40_cleanup.py
          python3 tools/v41b_runner.py
          python3 tools/v42b_runner.py
          python3 tools/v43b_runner.py
          python3 tools/v44c_runner.py
          python3 tools/v45c_runner.py
          python3 tools/v46b_runner.py
          python3 tools/v47_lifecycle_security_audit.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter static analysis
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyzer.log
      - name: Show analyzer failure context
        if: steps.analyze.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('analyzer.log').read_text(errors='replace')
          seen = set()
          for file, line in re.findall(r'• (lib/[^:]+\.dart):(\d+):\d+ •', log):
              key = (file, int(line))
              if key in seen:
                  continue
              seen.add(key)
              lines = Path(file).read_text(errors='replace').splitlines()
              number = int(line)
              print(f'--- {file}:{number} ---')
              for index in range(max(1, number - 5), min(len(lines), number + 5) + 1):
                  print(f'{index}: {lines[index - 1]}')
          PY
      - name: Enforce clean analyzer
        if: steps.analyze.outcome == 'failure'
        run: exit 1
      - name: Flutter tests
        run: flutter test
      - name: PHP syntax check mobile APIs
        working-directory: .
        run: |
          php -l flutter/backend/api/mobile.php
          php -l backend/api/mobile.php
          php -l flutter/backend/api/mobile_social_v31.php
          php -l backend/api/mobile_social_v31.php
          php -l backend/api/mobile_e2ee_v32.php
          php -l flutter/backend/api/mobile_realtime_push_v44.php
          php -l backend/api/mobile_realtime_push_v44.php
      - name: Realtime gateway syntax check
        working-directory: .
        run: node --check realtime/server.mjs
      - name: Deep v4.7 regression audit
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api = Path('flutter/lib/core/api_client.dart').read_text()
          social = Path('flutter/lib/core/social_api.dart').read_text()
          state = Path('flutter/lib/core/app_state.dart').read_text()
          chat = Path('flutter/lib/screens/chat_screen.dart').read_text()
          calls = Path('flutter/lib/screens/call_screen.dart').read_text()
          profile = Path('flutter/lib/screens/profile_screen.dart').read_text()
          security = Path('flutter/lib/screens/security_screen.dart').read_text()
          mobile = Path('backend/api/mobile.php').read_text()
          social_server = Path('backend/api/mobile_social_v31.php').read_text()
          push_module = Path('backend/api/mobile_realtime_push_v44.php').read_text()
          realtime = Path('flutter/lib/core/realtime_service.dart').read_text()
          push = Path('flutter/lib/core/push_service.dart').read_text()
          native = Path('flutter/android/app/src/main/kotlin/online/taleempk/studyhub/MainActivity.kt').read_text()
          manifest = Path('flutter/android/app/src/main/AndroidManifest.xml').read_text()
          pubspec = Path('flutter/pubspec.yaml').read_text()
          assert 'version: 4.7.0+470' in pubspec
          assert '_authRequestWithRetry' in api and '_compatTokenKey' in api
          assert 'suspendedpage.cgi' in api and 'server returned a web page instead of API data' in api
          assert '_recoverBootstrapInBackground' in state
          assert 'on HandshakeException' in social and 'on TlsException' in social
          assert 'status == 401 && _isSessionFailure(message)' in social
          assert 'class _ProfileConnectionsScreen extends StatefulWidget' in profile
          assert 'int _requestSerial = 0;' in profile and 'requestSerial != _requestSerial' in profile
          assert "_openConnections(p, 'followers')" in profile and "_openConnections(p, 'following')" in profile
          assert 'color: _verificationColor(p)' in profile
          assert "value: _bool(s['show_connections'], true)" in security
          assert "if($targetId<=0)mobile_error('Choose a valid profile.',400);" in social_server
          assert 'createPositionStream(' in chat and 'progressTimer = Timer.periodic' in chat
          assert 'Future<void> _syncAfterSend() async' in chat
          assert 'voicePreviewViewOnce' in chat and '_prepareViewOnceFile' in chat
          assert "String get _draftKey => 'chat_draft_${widget.conversation.id}'" in chat
          assert 'sending || widget.conversation.isGroup' in chat
          assert 'voicePreviewViewOnce && !widget.conversation.isGroup' in chat
          assert "title: 'Create poll'" in chat
          assert 'await remoteRenderer.initialize();\n    if (!mounted) return;' in calls
          assert 'WebSocketChannel.connect' in realtime
          assert 'FirebaseMessaging.instance' in push
          assert "if ($action === 'push_chat')" in push_module
          assert 'POST_NOTIFICATIONS' in manifest
          assert 'WindowManager.LayoutParams.FLAG_SECURE' in native
          assert "if ($action === 'mark_view_once')" in mobile and '@unlink($file)' in mobile
          assert "_token?.substring" + "(0, 8)" not in api
          assert "AppState get _appState" in chat
          print('v4.7 deep regression audit passed')
          PY
      - name: Build universal APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --obfuscate --split-debug-info=build/symbols-universal && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1
      - name: Preserve universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TaleemPK-v4.7.0-Universal.apk
      - name: Build smaller per-ABI APKs
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols-split && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: TaleemPK-v4.7.0-APKs
          path: |
            flutter/build/app/outputs/flutter-apk/TaleemPK-v4.7.0-Universal.apk
            flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
