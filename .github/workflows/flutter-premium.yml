name: Build TaleemPK Flutter APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/flutter-premium.yml'
  push:
    branches: [main, flutter-premium-v2]
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/flutter-premium.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Finalize v3.1 source
        working-directory: .
        run: python3 tools/v31_finalize.py
      - name: Apply v3.2 messaging and E2EE upgrade
        working-directory: .
        run: python3 tools/run_v32.py
      - name: Apply v3.3 media, device and performance hotfix
        working-directory: .
        run: python3 tools/v33_final.py
      - name: Apply v3.4 adaptive chat runtime
        working-directory: .
        run: python3 tools/v34_chat_runtime.py
      - name: Apply v3.5 profile and media polish
        working-directory: .
        run: python3 tools/v35b_profile_media_polish.py
      - name: Clean legacy v3.5 analyzer code
        working-directory: .
        run: python3 tools/v35c_cleanup.py
      - name: Apply v3.6 UI and navigation polish
        working-directory: .
        run: python3 tools/v36_ui_navigation_polish.py
      - name: Fix v3.6 splash class boundary
        working-directory: .
        run: python3 tools/v36b_splash_fix.py
      - name: Apply v3.7 chat and identity polish
        working-directory: .
        run: python3 tools/v37b_chat_identity_polish.py
      - name: Clean v3.7 mention analyzer warnings
        working-directory: .
        run: python3 tools/v37c_analyzer_cleanup.py
      - name: Apply corrected v3.8 messenger, security and verification polish
        working-directory: .
        run: python3 tools/v38b_boundary_fix.py
      - name: Apply corrected v3.9 identity, speed and verification polish
        working-directory: .
        run: python3 tools/v39b_runner.py
      - name: Apply v4.0 audio, login and performance hardening
        working-directory: .
        run: python3 tools/v40_runner.py
      - name: Clean legacy v4 analyzer code
        working-directory: .
        run: python3 tools/v40_cleanup.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: PHP syntax check mobile APIs
        working-directory: .
        run: |
          php -l flutter/backend/api/mobile.php
          php -l backend/api/mobile.php
          php -l flutter/backend/api/mobile_social_v31.php
          php -l backend/api/mobile_social_v31.php
          php -l backend/api/mobile_e2ee_v32.php
      - name: Deep regression audit
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api = Path('flutter/lib/core/api_client.dart').read_text()
          state = Path('flutter/lib/core/app_state.dart').read_text()
          chat = Path('flutter/lib/screens/chat_screen.dart').read_text()
          conv = Path('flutter/lib/screens/conversations_screen.dart').read_text()
          profile = Path('flutter/lib/screens/profile_screen.dart').read_text()
          security = Path('flutter/lib/screens/security_screen.dart').read_text()
          verification = Path('flutter/lib/screens/verification_screen.dart').read_text()
          common = Path('flutter/lib/widgets/common.dart').read_text()
          home = Path('flutter/lib/screens/home_screen.dart').read_text()
          shell = Path('flutter/lib/screens/home_shell.dart').read_text()
          main = Path('flutter/lib/main.dart').read_text()
          mobile = Path('backend/api/mobile.php').read_text()
          social = Path('backend/api/mobile_social_v31.php').read_text()
          native = Path('flutter/android/app/src/main/kotlin/online/taleempk/studyhub/MainActivity.kt').read_text()
          native_bridge = Path('flutter/lib/core/native_bridge.dart').read_text()
          auth = Path('flutter/lib/screens/auth_screen.dart').read_text()
          pubspec = Path('flutter/pubspec.yaml').read_text()
          assert '.get(source, headers: authHeaders)' in api
          assert 'await NativeBridge.deviceName()' in api
          assert "'User-Agent': 'TaleemPKAndroid/3.9'" in api
          assert api.count("'client': 'TaleemPK Android app'") >= 2
          assert api.count("'tz_offset':") >= 2 and api.count("'tz_name':") >= 2
          assert '_attachmentCache' not in api
          assert 'pollTicks % 12' in chat
          assert 'Duration(milliseconds: immediate ? 60 : delayMs)' in chat
          assert 'Future<void> _syncAfterSend() async' in chat
          assert chat.count('await _syncAfterSend();') >= 4
          assert 'recordingPaused = true;' in chat and 'await recorder.resume();' in chat
          assert "label: 'Pen'" in chat and "label: 'Highlight'" in chat and "label: 'Hide'" in chat
          assert "'story': '9:16'" in chat
          assert 'RenderRepaintBoundary' in chat and '_PhotoMarkupPainter' in chat
          assert 'paths.length >= 20' in chat and 'Add photos' in chat
          assert '_processOutgoingPhoto' not in chat
          assert 'PublicProfileScreen(' in chat
          assert 'profile.php?u=' not in chat
          assert "hintText: 'Message...'" in chat
          assert 'Icons.attach_file_rounded' in chat
          assert 'FocusManager.instance.primaryFocus?.unfocus()' in chat
          assert 'height: compactHeight' in chat and 'crossAxisCount: 8' in chat
          assert 'Uploading photo / file' in chat
          assert '_mentionSuggestions();' in chat and '_insertMention(member)' in chat
          assert 'Widget _recordingBar()' in chat
          assert 'Future<void> _sendText()' in chat
          assert 'bool get _chatBlocked' in chat
          assert 'createPositionStream(' in chat
          assert 'progressTimer = Timer.periodic' in chat
          assert 'livePosition.inMilliseconds > streamedPosition.inMilliseconds' in chat
          assert 'rootNavigator: true' in conv
          assert '_verificationColor(ProfileData p)' in profile
          assert "tooltip: 'Sign out'" in profile
          assert 'Keep your learning identity up to date' in profile
          assert "section('BASIC INFORMATION'" in profile
          assert "section('EDUCATION'" in profile
          assert 'maximumSize: const Size(double.infinity, 44)' in profile
          assert 'securitySnapshot()' in api and "'action': 'security_snapshot'" in api
          assert 'The website API is older than this app.' in security
          assert 'Sign out of this device' in security
          assert 'network/IP area' in security
          assert 'Secure sign-in storage timed out on this phone.' in api
          assert 'Future<BootstrapData> _bootstrapAfterAuth() async' in state
          assert 'Sign-in could not be completed on this phone.' in state
          assert 'Sign-in could not finish on this phone.' in auth
          assert ".timeout(const Duration(seconds: 2))" in native_bridge
          assert 'await api.clearToken();' in state
          assert 'Verify your TaleemPK profile' in verification
          assert 'CNIC / B-Form / Passport number *' in verification
          assert 'YOUR DETAILS' in verification and 'DOCUMENTS' in verification
          assert '_VerificationStep' in verification and 'AB1234567' in verification
          assert 'Enter your teaching role or designation.' in verification
          assert 'PageRoute<T> premiumRoute<T>' in common
          assert 'transitionDuration: const Duration(milliseconds: 135)' in common
          assert 'Something needs attention' in common
          assert 'Your learning space is ready' in home
          assert "'Practice', 'Quick quiz'" in home
          assert 'WidgetsBindingObserver' in shell
          assert 'didChangeAppLifecycleState' in shell
          assert 'indicatorShape: RoundedRectangleBorder' in shell
          assert 'Preparing your learning space' in main
          assert 'LinearProgressIndicator' in main
          assert main.count('class OfflineScreen extends StatelessWidget') == 1
          assert main.count('Widget _orb(double size, Color color)') == 1
          assert "if ($action === 'security_snapshot')" in mobile
          assert "'api_version' => '3.9'" in mobile
          assert 'TaleemPKApp/3.9' in mobile
          assert 'TaleemPKAndroid/3.9' in mobile
          assert "$signin['device'] = $safeDevice;" in mobile
          assert "$signin['browser'] = 'TaleemPK Android app';" in mobile
          assert 'verification_status' in social and 'verification_apply' in social
          assert 'portrait_story' in native
          assert 'deviceName()' in native
          assert 'version: 4.0.0+400' in pubspec
          print('v4.0 deep regression audit passed')
          PY
      - name: Build universal APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols-universal
      - name: Preserve universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TaleemPK-v4.0.0-Universal.apk
      - name: Build smaller per-ABI APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols-split
      - uses: actions/upload-artifact@v4
        with:
          name: TaleemPK-v4.0.0-APKs
          path: |
            flutter/build/app/outputs/flutter-apk/TaleemPK-v4.0.0-Universal.apk
            flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
