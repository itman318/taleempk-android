name: Build StudyHub Flutter APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'tools/patch_v30.py'
      - '.github/workflows/flutter-premium.yml'
  push:
    branches: [main, flutter-premium-v2]
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'tools/patch_v30.py'
      - '.github/workflows/flutter-premium.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Apply TaleemPK v3 source migration
        run: python ../tools/patch_v30.py
      - name: Commit TaleemPK v3 source migration
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898253+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Build TaleemPK v3 reliability and security foundation"
            git push
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TaleemPK-v3.0.0-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
