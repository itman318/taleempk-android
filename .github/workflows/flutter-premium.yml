name: Build TaleemPK Flutter APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'tools/fix_v30_security_schema.py'
      - '.github/workflows/flutter-premium.yml'
  push:
    branches: [main, flutter-premium-v2]
    paths:
      - 'flutter/**'
      - 'backend/**'
      - 'tools/fix_v30_security_schema.py'
      - '.github/workflows/flutter-premium.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Apply TaleemPK v3 privacy schema correction
        run: python ../tools/fix_v30_security_schema.py
      - name: Commit TaleemPK v3 privacy schema correction
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898253+github-actions[bot]@users.noreply.github.com"
            git -C .. add -A
            git commit -m "Align TaleemPK v3 privacy controls with production schema"
            git push
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: PHP syntax check mobile API
        working-directory: .
        run: |
          php -l flutter/backend/api/mobile.php
          php -l backend/api/mobile.php
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TaleemPK-v3.0.0-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
