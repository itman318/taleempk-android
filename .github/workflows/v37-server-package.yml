name: Package TaleemPK v4.2 Server API

on:
  workflow_dispatch:
  push:
    branches:
      - flutter-premium-v2
    paths:
      - '.github/workflows/v37-server-package.yml'
      - 'backend/**'
      - 'tools/**'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate final v4.2 server sources
        run: |
          python3 tools/v31_finalize.py
          python3 tools/run_v32.py
          python3 tools/v33_final.py
          python3 tools/v34_chat_runtime.py
          python3 tools/v35b_profile_media_polish.py
          python3 tools/v35c_cleanup.py
          python3 tools/v36_ui_navigation_polish.py
          python3 tools/v36b_splash_fix.py
          python3 tools/v37b_chat_identity_polish.py
          python3 tools/v37c_analyzer_cleanup.py
          python3 tools/v38b_boundary_fix.py
          python3 tools/v39b_runner.py
          python3 tools/v40_runner.py
          python3 tools/v40_cleanup.py
          python3 tools/v41b_runner.py
          python3 tools/v42b_runner.py

      - name: Verify PHP syntax
        run: |
          php -l backend/api/mobile.php
          php -l backend/api/mobile_social_v31.php
          php -l backend/api/mobile_e2ee_v32.php

      - name: Verify required v4.2 API actions
        run: |
          grep -q "security_snapshot" backend/api/mobile.php
          grep -q "privacy_get" backend/api/mobile.php
          grep -q "sessions" backend/api/mobile.php
          grep -q "TaleemPK Android app" backend/api/mobile.php
          grep -q "mark_view_once" backend/api/mobile.php
          grep -q "UPDATE messages SET status='deleted'" backend/api/mobile.php
          grep -q "@unlink" backend/api/mobile.php
          grep -q "verification_status" backend/api/mobile_social_v31.php
          grep -q "verification_apply" backend/api/mobile_social_v31.php

      - name: Prepare server update
        run: |
          mkdir -p TaleemPK-v4.2.0-Server-Update/api
          cp backend/api/mobile.php TaleemPK-v4.2.0-Server-Update/api/mobile.php
          cp backend/api/mobile_social_v31.php TaleemPK-v4.2.0-Server-Update/api/mobile_social_v31.php
          cp backend/api/mobile_e2ee_v32.php TaleemPK-v4.2.0-Server-Update/api/mobile_e2ee_v32.php
          cat > TaleemPK-v4.2.0-Server-Update/README.txt <<'EOF'
          TaleemPK v4.2 server update

          Upload all three files inside this package's api/ folder to your website api/ folder.
          Typical destination: public_html/api/

          Replace/overwrite:
          - api/mobile.php
          - api/mobile_social_v31.php
          - api/mobile_e2ee_v32.php

          Keep a backup of the existing files before replacing them.

          v4.2 includes Android login/session compatibility APIs and true one-time
          media cleanup. After a recipient consumes a one-time photo or finishes a
          one-time voice message, the server removes the stored media file and marks
          that message deleted so it cannot be fetched again.

          Android screenshot/screen-recording protection for one-time media is handled
          by the v4.2 app using FLAG_SECURE and requires the matching v4.2 APK.
          EOF

      - name: Upload server update
        uses: actions/upload-artifact@v4
        with:
          name: TaleemPK-v4.2.0-Server-Update
          path: TaleemPK-v4.2.0-Server-Update/
          if-no-files-found: error