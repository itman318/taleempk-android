name: Package TaleemPK v4.4 Server + Realtime

on:
  workflow_dispatch:
  push:
    branches:
      - flutter-premium-v2
    paths:
      - '.github/workflows/v37-server-package.yml'
      - 'backend/**'
      - 'realtime/**'
      - 'render.yaml'
      - 'tools/**'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate final v4.4 server sources
        run: |
          python3 tools/v31_finalize.py
          python3 tools/run_v32.py
          python3 tools/v33_final.py
          python3 tools/v34_chat_runtime.py
          python3 tools/v35b_profile_media_polish.py
          python3 tools/v35c_cleanup.py
          python3 tools/v36_ui_navigation_polish.py
          python3 tools/v36b_splash_fix.py
          python3 tools/v37b_chat_identity_polish.py
          python3 tools/v37c_analyzer_cleanup.py
          python3 tools/v38b_boundary_fix.py
          python3 tools/v39b_runner.py
          python3 tools/v40_runner.py
          python3 tools/v40_cleanup.py
          python3 tools/v41b_runner.py
          python3 tools/v42b_runner.py
          python3 tools/v43b_runner.py
          python3 tools/v44_realtime_push.py

      - name: Verify PHP syntax
        run: |
          php -l backend/api/mobile.php
          php -l backend/api/mobile_social_v31.php
          php -l backend/api/mobile_e2ee_v32.php
          php -l backend/api/mobile_realtime_push_v44.php

      - name: Verify realtime gateway syntax
        run: node --check realtime/server.mjs

      - name: Verify required v4.4 actions
        run: |
          grep -q "security_snapshot" backend/api/mobile.php
          grep -q "mark_view_once" backend/api/mobile.php
          grep -q "mobile_realtime_push_v44.php" backend/api/mobile.php
          grep -q "realtime_config" backend/api/mobile_realtime_push_v44.php
          grep -q "register_push" backend/api/mobile_realtime_push_v44.php
          grep -q "push_chat" backend/api/mobile_realtime_push_v44.php
          grep -q "fcm.googleapis.com/v1/projects" backend/api/mobile_realtime_push_v44.php
          grep -q "verification_status" backend/api/mobile_social_v31.php
          grep -q "verification_apply" backend/api/mobile_social_v31.php

      - name: Prepare server update
        run: |
          mkdir -p TaleemPK-v4.4.0-Server-Realtime-Update/api
          mkdir -p TaleemPK-v4.4.0-Server-Realtime-Update/realtime
          cp backend/api/mobile.php TaleemPK-v4.4.0-Server-Realtime-Update/api/mobile.php
          cp backend/api/mobile_social_v31.php TaleemPK-v4.4.0-Server-Realtime-Update/api/mobile_social_v31.php
          cp backend/api/mobile_e2ee_v32.php TaleemPK-v4.4.0-Server-Realtime-Update/api/mobile_e2ee_v32.php
          cp backend/api/mobile_realtime_push_v44.php TaleemPK-v4.4.0-Server-Realtime-Update/api/mobile_realtime_push_v44.php
          cp realtime/package.json TaleemPK-v4.4.0-Server-Realtime-Update/realtime/package.json
          cp realtime/server.mjs TaleemPK-v4.4.0-Server-Realtime-Update/realtime/server.mjs
          cp realtime/README.md TaleemPK-v4.4.0-Server-Realtime-Update/realtime/README.md
          cp render.yaml TaleemPK-v4.4.0-Server-Realtime-Update/render.yaml
          cat > TaleemPK-v4.4.0-Server-Realtime-Update/README.txt <<'EOF'
          TaleemPK v4.4 server + realtime update

          WEBSITE API
          Upload the four files inside api/ to your website api/ folder,
          normally public_html/api/, and overwrite the matching files.

          REALTIME WEBSOCKET
          The realtime/ folder and render.yaml contain the small Node WebSocket
          gateway. Deploy it as a separate Render web service and set the same
          TALEEMPK_REALTIME_SECRET on Render and on the PHP website. Then set
          TALEEMPK_WS_URL on the PHP website to the service's wss:// URL.

          FIREBASE PUSH
          For killed/background-app notifications configure these PHP hosting
          environment values:
          FIREBASE_PROJECT_ID
          FIREBASE_ANDROID_APP_ID
          FIREBASE_SENDER_ID
          FIREBASE_API_KEY
          FIREBASE_CLIENT_EMAIL
          FIREBASE_PRIVATE_KEY

          Without those external values the app still works normally and falls
          back to the existing polling system. Login and message delivery never
          depend on WebSocket or Firebase being available.
          EOF

      - name: Upload server update
        uses: actions/upload-artifact@v4
        with:
          name: TaleemPK-v4.4.0-Server-Realtime-Update
          path: TaleemPK-v4.4.0-Server-Realtime-Update/
          if-no-files-found: error
